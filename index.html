<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>出門嗎？讓我瞧瞧！</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@700;900&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #FDF4E3; /* 漫畫紙的米黃色 */
            --main-text: #2C2C2C;
            --border-color: #000000;
            --accent-yellow: #FFD95A;
            --accent-blue: #6CC3D5;
            --accent-red: #FF6B6B;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color );
            color: var(--main-text);
            padding: 15px;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
        }

        /* 標題 */
        .main-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2.8rem;
            text-align: center;
            padding: 10px;
            border: 4px solid var(--border-color);
            background-color: var(--accent-yellow);
            transform: rotate(-2deg);
            box-shadow: 8px 8px 0px var(--border-color);
            margin-bottom: 30px;
        }

        /* 地區選擇 */
        .location-selector {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }
        .location-btn {
            flex: 1;
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 900;
            font-size: 1rem;
            padding: 12px 5px;
            border: 3px solid var(--border-color);
            background-color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }
        .location-btn.active {
            background-color: var(--accent-blue);
            color: white;
            transform: translateY(-4px);
            box-shadow: 0px 4px 0px var(--border-color);
        }

        /* 主要卡片 */
        .hero-card {
            background-color: white;
            border: 4px solid var(--border-color);
            padding: 20px;
            text-align: center;
            margin-bottom: 25px;
            position: relative;
        }
        /* 漫畫對話框 */
        .hero-card::after {
            content: '';
            position: absolute;
            bottom: -23px;
            left: 40px;
            border-width: 24px 24px 0 0;
            border-style: solid;
            border-color: var(--border-color) transparent transparent transparent;
        }
        .hero-card::before {
            content: '';
            position: absolute;
            bottom: -16px;
            left: 44px;
            border-width: 17px 17px 0 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
            z-index: 1;
        }

        .hero-time {
            font-size: 1.2rem;
            font-weight: 900;
            background-color: var(--accent-red);
            color: white;
            display: inline-block;
            padding: 2px 12px;
            margin-bottom: 15px;
        }
        .hero-weather-icon { font-size: 5rem; }
        .hero-weather-text {
            font-size: 2rem;
            font-weight: 900;
            margin: 5px 0;
        }
        .hero-temp {
            font-size: 1.5rem;
            font-weight: 700;
            color: #555;
        }
        .hero-advice {
            font-size: 1.2rem;
            font-weight: 900;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 3px dashed var(--border-color);
        }

        /* 接下來的預報 */
        .future-title {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 2rem;
            text-align: center;
            margin-bottom: 15px;
        }
        .future-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        .mini-card {
            background-color: #fff;
            border: 3px solid var(--border-color);
            padding: 15px;
            text-align: center;
        }
        .mini-time { font-weight: 900; margin-bottom: 10px; }
        .mini-icon { font-size: 2.5rem; }
        .mini-temp { font-weight: 700; font-size: 1.1rem; }
        .mini-rain { font-size: 0.9rem; color: #444; margin-top: 5px; }

        /* Loading 畫面 */
        .loading-screen {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 0.5s ease;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 4rem; animation: spin 1s linear infinite;">🌀</div>
        <p style="font-family: 'ZCOOL KuaiLe', cursive; font-size: 1.5rem; margin-top: 20px;">正在偷看老天爺的劇本...</p>
        <style>@keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }</style>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <h1 class="main-title">出門嗎？讓我瞧瞧！</h1>

        <div class="location-selector">
            <button class="location-btn active" data-location="taipei">臺北市</button>
            <button class="location-btn" data-location="new-taipei">新北市</button>
            <button class="location-btn" data-location="tainan">臺南市</button>
        </div>

        <div id="heroCard"></div>
        
        <h2 class="future-title">接下來呢？</h2>
        <div class="future-grid" id="futureForecasts"></div>
    </div>

    <script>
        const API_BASE_URL = "https://你的服務名稱.zeabur.app/api/weather";

        function getWeatherIcon(weather ) {
            if (weather.includes("晴")) return "☀️";
            if (weather.includes("多雲") || weather.includes("陰")) return "☁️";
            if (weather.includes("雨")) return "🌧️";
            if (weather.includes("雷")) return "⛈️";
            return "🤔";
        }

        function getFunnyAdvice(f) {
            const rain = parseInt(f.rain);
            const maxT = parseInt(f.maxTemp);
            if (rain > 60) return "外面在下瀑布，想游泳再去！";
            if (f.weather.includes("晴") && maxT > 30) return "太陽大到可以煎蛋，別跟自己過不去！";
            if (f.weather.includes("晴")) return "天氣不錯，勉為其難出門吧！";
            if (maxT < 18) return "冷得像個笑話，穿得像熊一樣再說！";
            return "天氣普普，看你心情囉～";
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 6 && hour < 18) return "白天";
            return "晚上";
        }

        function renderWeather(data) {
            const forecasts = data.forecasts;
            const current = forecasts[0];
            const future = forecasts.slice(1);

            // 1. 渲染主卡片
            document.getElementById('heroCard').innerHTML = `
                <div class="hero-card">
                    <div class="hero-time">${getTimePeriod(current.startTime)}</div>
                    <div class="hero-weather-icon">${getWeatherIcon(current.weather)}</div>
                    <div class="hero-weather-text">${current.weather}</div>
                    <div class="hero-temp">${current.minTemp}°C - ${current.maxTemp}°C</div>
                    <div class="hero-advice">一句話：${getFunnyAdvice(current)}</div>
                </div>
            `;

            // 2. 渲染接下來的預報
            const futureContainer = document.getElementById('futureForecasts');
            futureContainer.innerHTML = '';
            future.forEach(f => {
                futureContainer.innerHTML += `
                    <div class="mini-card">
                        <div class="mini-time">${getTimePeriod(f.startTime)}</div>
                        <div class="mini-icon">${getWeatherIcon(f.weather)}</div>
                        <div class="mini-temp">${f.minTemp}° - ${f.maxTemp}°</div>
                        <div class="mini-rain">降雨率: ${f.rain}%</div>
                    </div>
                `;
            });
        }

        async function fetchWeather(location) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('mainContent').style.display = 'none';

            try {
                const delay = new Promise(res => setTimeout(res, 1000));
                const response = await fetch(`${API_BASE_URL}/${location}`);
                
                await delay; // 確保 loading 動畫至少跑一秒

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.error || `HTTP 錯誤 ${response.status}`);
                }
                const json = await response.json();

                if (json.success) {
                    renderWeather(json.data);
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error(json.error);
                }
            } catch (e) {
                alert(`GG了！${e.message}`);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const locationButtons = document.querySelectorAll('.location-btn');
            let currentLocation = 'taipei';

            locationButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    locationButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLocation = btn.dataset.location;
                    fetchWeather(currentLocation);
                });
            });

            fetchWeather(currentLocation);
        });
    </script>
</body>
</html>
