<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>天龍人外出探測器</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #F7FAFC; /* 淺灰背景 */
            --card-bg: #FFFFFF;
            --title-color: #1A202C; /* 主要文字 - 深灰 */
            --text-color: #4A5568; /* 次要文字 - 中灰 */
            --accent-gold: #D69E2E; /* 金色點綴 */
            --border-color: #E2E8F0; /* 邊框色 */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: var(--bg-color );
            color: var(--title-color);
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            max-width: 450px;
            margin: 0 auto;
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 900;
            text-align: center;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        .sub-title {
            font-size: 1rem;
            font-weight: 500;
            text-align: center;
            color: var(--text-color);
            margin-bottom: 30px;
        }

        .location-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 30px;
        }
        .location-btn {
            font-family: 'Noto Sans TC', sans-serif;
            font-weight: 700;
            font-size: 1rem;
            padding: 15px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease-in-out;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .location-btn:hover {
            border-color: var(--accent-gold);
            color: var(--title-color);
        }
        .location-btn.active {
            border-color: var(--accent-gold);
            background-color: #FFFBEB; /* 淡黃色背景 */
            color: var(--accent-gold);
            box-shadow: 0 4px 14px 0 rgba(0,0,0,0.05);
            transform: translateY(-2px);
        }
        .location-btn .label {
            font-size: 0.8rem;
            font-weight: 500;
        }

        .result-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05);
        }
        .result-time {
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-color);
            margin-bottom: 15px;
        }
        .result-icon {
            font-size: 5rem;
            margin-bottom: 10px;
        }
        .result-title {
            font-size: 2rem;
            font-weight: 900;
            margin-bottom: 5px;
        }
        .result-subtitle {
            font-size: 1.1rem;
            color: var(--text-color);
            margin-bottom: 20px;
        }
        .result-details {
            font-size: 0.9rem;
            color: #718096;
        }

        .loading-screen {
            position: fixed; inset: 0; background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 999; transition: opacity 0.5s ease;
        }
        .loading-screen.hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loading" class="loading-screen">
        <div style="font-size: 3rem;">🧐</div>
        <p style="font-weight: 700; font-size: 1.2rem; margin-top: 15px;">分析天候，確保您的尊貴...</p>
    </div>

    <div class="container" id="mainContent" style="display: none;">
        <h1 class="main-title">天龍人外出探測器</h1>
        <p class="sub-title">評估氣候是否配得上您的身份</p>

        <div class="location-selector">
            <button class="location-btn active" data-location="taipei">
                <span>天龍國國內 (臺北市)</span>
                <span class="label">首都核心</span>
            </button>
            <button class="location-btn" data-location="new-taipei">
                <span>天龍國近郊 (新北市)</span>
                <span class="label">邊境地區</span>
            </button>
            <button class="location-btn" data-location="tainan">
                <span>天龍國國外 (臺南市)</span>
                <span class="label">南部淨土</span>
            </button>
        </div>

        <div id="resultCard" class="result-card">
            <!-- 天氣結果將會顯示在這裡 -->
        </div>
    </div>

    <script>
        // 請務必換成你自己的 Zeabur 服務 URL
        const API_BASE_URL = "https://weathernewtaipei.zeabur.app/api/weather";

        function getFunnyAdvice(forecast, location ) {
            const rain = parseInt(forecast.rain);
            const maxT = parseInt(forecast.maxTemp);
            const minT = parseInt(forecast.minTemp);
            const weather = forecast.weather;

            // 優先處理極端天氣
            if (rain > 70) return { icon: '🤢', title: '下得像ㄆㄨㄣ', subtitle: '別讓髒水弄髒您的訂製鞋。' };
            if (maxT > 34) return { icon: '🥵', title: '這是人待的？', subtitle: '這種溫度只存在於國外，快回百貨公司。' };
            if (minT < 15) return { icon: '🥶', title: '氣溫不識相', subtitle: '寒流來襲，您的風衣該出場了，但僅限室內。' };

            // 根據地區微調文案
            if (location === 'tainan') {
                if (weather.includes("晴")) return { icon: '😎', title: '陽光過剩', subtitle: '國外的太陽太熱情，不宜久留。' };
                return { icon: '🤔', title: '國外天氣', subtitle: '反正您也不會去，隨便啦。' };
            }
            
            // 國內與近郊的正常天氣
            if (weather.includes("晴") && maxT < 28) return { icon: '👑', title: '天氣完美', subtitle: '氣候宜人，適合到信義區巡視。' };
            if (weather.includes("雨")) return { icon: '😫', title: '竟然下雨？', subtitle: '叫司機備車，或直接取消行程。' };
            if (weather.includes("多雲") || weather.includes("陰")) return { icon: '😐', title: '天空陰沉', subtitle: '影響拍照心情，建議改約室內。' };
            
            return { icon: '🧐', title: '氣候尚可', subtitle: '出門與否，取決於您的心情。' };
        }

        function getTimePeriod(startTime) {
            const hour = new Date(startTime).getHours();
            if (hour >= 6 && hour < 18) return "白天";
            return "晚上";
        }

        function renderWeather(data, location) {
            // 36小時預報通常第一筆就是最近的，我們直接用
            const currentForecast = data.forecasts[0];
            const advice = getFunnyAdvice(currentForecast, location);

            document.getElementById('resultCard').innerHTML = `
                <div class="result-time">${getTimePeriod(currentForecast.startTime)} | ${currentForecast.weather}</div>
                <div class="result-icon">${advice.icon}</div>
                <div class="result-title">${advice.title}</div>
                <div class="result-subtitle">${advice.subtitle}</div>
                <hr style="border:none; border-top: 1px solid var(--border-color); margin: 20px 0;">
                <div class="result-details">
                    溫度: ${currentForecast.minTemp}°C - ${currentForecast.maxTemp}°C | 降雨機率: ${currentForecast.rain}%
                </div>
            `;
        }

        async function fetchWeather(location) {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('mainContent').style.display = 'none';

            try {
                const delay = new Promise(res => setTimeout(res, 800));
                const response = await fetch(`${API_BASE_URL}/${location}`);
                
                await delay;

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || `伺服器好像睡著了`);
                }
                const json = await response.json();

                if (json.success) {
                    renderWeather(json.data, location);
                    document.getElementById('mainContent').style.display = 'block';
                } else {
                    throw new Error(json.error);
                }
            } catch (e) {
                alert(`探測失敗：${e.message}`);
            } finally {
                document.getElementById('loading').classList.add('hidden');
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const locationButtons = document.querySelectorAll('.location-btn');
            let currentLocation = 'taipei'; // 預設為天龍國國內

            locationButtons.forEach(btn => {
                btn.addEventListener('click', () => {
                    locationButtons.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentLocation = btn.dataset.location;
                    fetchWeather(currentLocation);
                });
            });

            // 初始載入預設地區的天氣
            fetchWeather(currentLocation);
        });
    </script>
</body>
</html>
